# render.yaml
# Render "Blueprint" config — lets Render auto-configure the service when you
# connect this repo (New + > Blueprint). Secrets are marked `sync: false` so
# Render prompts for the actual values in its dashboard instead of storing
# them here; nothing sensitive lives in this file.

services:
  - type: web
    name: realtyfill
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
